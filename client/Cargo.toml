[package]
name = "ws-shell-client"
version = "1.5.0"
edition = "2021"

[[bin]]
name = "ws-shell-client"
path = "src/main.rs"

[dependencies]
ws-shell-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
gethostname = "0.5"
libc = "0.2"
users = "0.11"
