name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 代码格式 & Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          # clippy 在 host 目标运行，无需 musl 工具链
          CARGO_BUILD_TARGET: ""

  # ── 编译验证（musl 静态链接）────────────────────────────────────────────────
  build:
    name: Build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          # ring/cc-rs 查找 x86_64-linux-musl-gcc，musl-tools 只提供 musl-gcc
          # 通过 CC 环境变量显式指定，无需创建 symlink
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build server
        run: cargo build --release -p ws-shell-server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Build agent
        run: cargo build --release -p node-metrics-agent
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Upload artifacts (server)
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/server

      - name: Upload artifacts (agent)
        uses: actions/upload-artifact@v4
        with:
          name: node-metrics-agent-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/node-metrics-agent
