name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # 允许创建 Release 和上传资产

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build server (release)
        run: cargo build --release -p ws-shell-server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Build agent (release)
        run: cargo build --release -p node-metrics-agent
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      # ── 整理产物，附上版本 tag ──────────────────────────────────────────────
      - name: Prepare release artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/server          dist/server-${TAG}-x86_64-linux-musl
          cp target/x86_64-unknown-linux-musl/release/node-metrics-agent dist/node-metrics-agent-${TAG}-x86_64-linux-musl
          ls -lh dist/

      # ── 生成 SHA256 校验文件 ────────────────────────────────────────────────
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # ── 创建 GitHub Release 并上传 ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/server-*-x86_64-linux-musl
            dist/node-metrics-agent-*-x86_64-linux-musl
            dist/checksums.txt
