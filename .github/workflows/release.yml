name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # 允许创建 Release 和上传资产

jobs:
  build-release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux 静态链接（musl）────────────────────────────────────────────
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            suffix: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            suffix: ""
          # ── macOS ─────────────────────────────────────────────────────────────
          - target: x86_64-apple-darwin
            os: macos-latest
            use_zigbuild: false
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            use_zigbuild: false
            suffix: ""
          # ── Windows ───────────────────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Linux musl：安装 zig + cargo-zigbuild ────────────────────────────────
      - name: Setup zig (musl targets)
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (musl targets)
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      # ── musl：用 zigbuild ────────────────────────────────────────────────────
      - name: Build (zigbuild)
        if: matrix.use_zigbuild
        run: |
          cargo zigbuild --release -p ws-shell-server   --target ${{ matrix.target }}
          cargo zigbuild --release -p node-metrics-agent --target ${{ matrix.target }}

      # ── 原生平台：直接 cargo build ───────────────────────────────────────────
      - name: Build (native)
        if: "!matrix.use_zigbuild"
        run: |
          cargo build --release -p ws-shell-server    --target ${{ matrix.target }}
          cargo build --release -p node-metrics-agent --target ${{ matrix.target }}

      # ── 整理产物，统一命名：<binary>-<version>-<target>[.exe] ─────────────────
      - name: Prepare artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          # server 可能叫 server 或 ws-shell-server，兼容两种命名
          for name in server ws-shell-server; do
            src="target/${{ matrix.target }}/release/${name}"
            if [ -f "$src" ]; then
              cp "$src" "dist/ws-shell-server-${TAG}-${{ matrix.target }}"
              break
            fi
          done
          cp "target/${{ matrix.target }}/release/node-metrics-agent" \
             "dist/node-metrics-agent-${TAG}-${{ matrix.target }}"
          ls -lh dist/

      - name: Prepare artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($name in @("server","ws-shell-server")) {
            $src = "target\${{ matrix.target }}\release\${name}.exe"
            if (Test-Path $src) {
              Copy-Item $src "dist\ws-shell-server-${TAG}-${{ matrix.target }}.exe"
              break
            }
          }
          Copy-Item "target\${{ matrix.target }}\release\node-metrics-agent.exe" `
                    "dist\node-metrics-agent-${TAG}-${{ matrix.target }}.exe"
          Get-ChildItem dist

      # ── SHA256 校验（unix）───────────────────────────────────────────────────
      - name: Generate checksums (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          sha256sum * > checksums-${{ matrix.target }}.txt
          cat checksums-${{ matrix.target }}.txt

      - name: Generate checksums (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Get-FileHash * -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Out-File -FilePath "checksums-${{ matrix.target }}.txt" -Encoding utf8
          Get-Content "checksums-${{ matrix.target }}.txt"

      # ── 上传到 GitHub Release ─────────────────────────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
